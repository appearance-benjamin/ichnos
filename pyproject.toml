[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ichnos"
version = "0.1.0"
description = "An auditable, AI-assisted pipeline for scoping reviews in psychology: search, screening, charting, findings with verbatim evidence, checked manuscripts and human check packs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []                      # the standard library only

[project.optional-dependencies]
pdf = ["pypdf"]                        # reading PDFs when GROBID is not running

[project.scripts]
ichnos = "ichnos.__main__:main"

[project.gui-scripts]
ichnos-app = "ichnos.desktop:main"

[tool.setuptools]
packages = ["ichnos", "ichnos.sources"]

[tool.setuptools.package-data]
ichnos = ["assets/*"]
