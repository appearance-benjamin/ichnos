# Example protocol (corpus A): analog settings, meaning and purpose after work ends.
#
# You own this file. Every run stores its full text and SHA-256 hash in the
# evidence store, so edit freely while tuning on the pilot, then freeze it for
# the OSF preregistration.

corpus = "A"
title = "Analog settings: meaning and purpose after work ends"
version = "0.7-pilot"

# Canonical string: AND / OR / NOT, "phrases", trailing * for truncation.
# Searched in titles and abstracts only; rendered mechanically for each source.
# Operators must be written out (no implicit AND); commas are not allowed.
query = '''
("meaning in life" OR "purpose in life" OR "meaningful work" OR "work identity" OR "work centrality")
AND (unemploy* OR "job loss" OR retire* OR furlough* OR "short-time work" OR underemploy* OR NEET OR "school-to-work")
AND (longitudinal OR panel OR trajector* OR prospective)
'''
# Names for the string's concept blocks, in order; the review page highlights each in its own colour.
query_blocks = ["construct", "setting", "design"]

sources = ["openalex", "semantic_scholar", "pubmed", "europepmc"]

[pilot]
max_records_per_source = 2000   # retrieval stops here and the report flags it
sample_size = 200               # records on the screening sheet
seed = 20261016                 # fixed, so the same pool always gives the same sheet

[screening]
stage = "title_abstract"
# Draft wording of the September scope rule; tighten it before preregistering.
rule = """
Include: an empirical study with a longitudinal design (two or more waves, or
prospective) of people whose work ended or never began (job loss, furlough or
short-time work, retirement, youth unemployment or NEET status,
underemployment), with an outcome on meaning in life, purpose in life,
meaningful work or work identity, that reports subgroups, trajectories or
moderators. Exclude cross-sectional studies.
Studies using Health and Retirement Study data that do not study the
retirement transition are excluded as wrong_setting.
At title and abstract stage, choose unsure when the abstract does not say
whether subgroups, trajectories or moderators are reported.
"""
decisions = ["include", "exclude", "unsure"]
exclude_reasons = [
    "not_empirical",        # theory, commentary, protocol
    "review",               # review or meta-analysis: exclude, but mine its references
    "cross_sectional",
    "no_meaning_outcome",
    "wrong_setting",        # work did not end or was never in question
    "no_heterogeneity",     # clearly no subgroups, trajectories or moderators
    "other",                # explain in the note column
]

# Metrics for agent screeners. Each record gets 0 (clearly not met), 1 (cannot
# tell) or 2 (clearly met) per metric, with a quote. The pipeline, not the
# agent, decides: the first metric scored 0, in this order, excludes with its
# fail_reason; all 2 includes; anything else is unsure.
[[screening.metrics]]
id = "empirical"
question = "Is it an original empirical study with its own data, not a review, theory piece, editorial, protocol, book or proceedings?"
fail_reason = "not_empirical"
review_reason = "review"

[[screening.metrics]]
id = "setting"
question = """Are the participants defined by work ending or never beginning: job loss or unemployment,
furlough or short-time work, the retirement transition, youth unemployment, NEET or school-to-work,
or underemployment? Health and Retirement Study papers that do not study the retirement transition,
and general older-adult samples, score 0."""
fail_reason = "wrong_setting"

[[screening.metrics]]
id = "outcome"
question = "Is meaning in life, purpose in life, meaningful work or work identity measured as an outcome, not only as a predictor of something else?"
fail_reason = "no_meaning_outcome"

[[screening.metrics]]
id = "design"
question = "Is the design longitudinal: two or more measurement waves, or prospective?"
fail_reason = "cross_sectional"

[[screening.metrics]]
id = "heterogeneity"
question = "Does it report subgroups, trajectories (including trajectory classes or change over a transition) or moderators?"
fail_reason = "no_heterogeneity"

# Optional: extend the built-in signal word lists (trajectory, heterogeneity,
# longitudinal, cross_sectional) or add your own; see psyscientist/signals.py.
[signals.add]
trajectory = ["before and after retirement", "after job loss"]

# The evidence map: what the extraction agent records for every kept study,
# and how studies are matched. Draft for corpus A; any domain works the same
# way with its own dimensions.
[map]
tree = ["setting", "construct", "measure", "design"]
match_across = "setting"                       # compare studies that differ here ...
match_on = ["construct", "measure", "design"]  # ... but agree on these

[[map.dimensions]]
name = "setting"
question = "In which situation of work ending or never beginning are the participants?"
categories = ["job_loss", "furlough", "retirement", "youth_never_employed", "underemployment", "other"]

[[map.dimensions]]
name = "construct"
question = "Which meaning-related construct is the outcome?"
categories = ["meaning_in_life", "purpose_in_life", "meaningful_work", "work_identity", "work_centrality", "other"]

[[map.dimensions]]
name = "measure"
question = "Which instrument measured that construct? Give its usual short name, e.g. mlq for the Meaning in Life Questionnaire or ryff pwb purpose for the Ryff purpose subscale."

[[map.dimensions]]
name = "design"
question = "What longitudinal design was used?"
categories = ["two_waves", "three_plus_waves", "prospective_cohort", "intensive_longitudinal", "qualitative_longitudinal", "intervention", "other"]

[[map.dimensions]]
name = "analysis"
question = "How was change or heterogeneity analysed?"
categories = ["growth_model", "growth_mixture_or_latent_class", "multilevel", "fixed_effects", "change_scores", "moderation", "qualitative", "other"]

[[map.dimensions]]
name = "heterogeneity"
question = "Which subgroups, moderators or trajectory classes are reported? List them briefly."

[[map.dimensions]]
name = "substitute"
question = "What, if anything, is reported to replace work as a source of meaning (e.g. volunteering, family, leisure)?"

[[map.dimensions]]
name = "population"
question = "Who was studied: age range and country?"

# Merge labels that mean the same thing after a first extraction (see the
# vocabulary at the end of the report's evidence map).
[map.aliases.measure]
"qualitative interviews" = "qualitative interview"

# Findings: one row per result of a kept study, with the passage that states
# it. `question` steers what counts as relevant; `fields` are recorded per
# finding (categories are checked); `matrix` picks two of them for the report.
[findings]
question = """What happens to meaning in life, purpose or work identity when work ends or never begins,
for whom, and what replaces work as a source of meaning?"""
max_per_study = 6
matrix = ["setting", "direction"]

[[findings.fields]]
name = "setting"
question = "The situation of the people the finding is about."
categories = ["job_loss", "furlough", "retirement", "youth_never_employed", "underemployment", "other"]

[[findings.fields]]
name = "predictor"
question = "What the finding relates the outcome to, compares or tracks it across: the predictor, condition, group contrast or transition (for example 'retirement vs continued work', 'work centrality', 'volunteering intervention'). A few words."

[[findings.fields]]
name = "outcome"
question = "The outcome: what is predicted or what changes, never the predictor. Depressive symptoms, anxiety, grief and psychological distress are distress."
categories = ["meaning_in_life", "purpose_in_life", "meaningful_work", "work_identity", "work_centrality", "well_being", "distress", "other"]

[[findings.fields]]
name = "direction"
question = "What happened to that outcome, or how it was related to something else."
categories = ["increase", "decrease", "no_change", "mixed", "differs_by_group", "association"]

[[findings.fields]]
name = "sign"
question = "The sign of the relation between predictor and outcome: positive (more of the predictor, more of the outcome; or the outcome rose after the transition), negative, null (no reliable relation or change), mixed (differs by subgroup or measure), or not_applicable."
categories = ["positive", "negative", "null", "mixed", "not_applicable"]

[[findings.fields]]
name = "substitute"
question = "What replaced work as a source of meaning in this finding, if anything; empty if nothing."

# What the evidence-first writer drafts. Every sentence must cite finding rows;
# the pipeline checks each one.
[writing]
section = "the results section of a conceptual review: what happens to meaning when work ends or never begins, for whom, and what replaces work as a source of meaning"
words = "1000 to 1500"

# The full paper: authors and what the reviewers judge it by.
[paper]
authors = [{name = "Your Name", affiliation = "Your University"}]
kind = "scoping review"
target = "a peer-reviewed psychology journal that publishes conceptual and scoping reviews"

# The parts of the paper whose findings you check in the app's Check findings
# tab (section names, or paragraph headings within a section).
headline = ["Abstract", "Principal findings", "Implications", "Conclusion"]

# Rules for the writer that belong to this corpus (added to the generic ones).
rules = ["Many findings concern older adults in general (setting `other`): keep them apart as context, never as evidence about losing work."]

# Your own statements for the Declarations section; until you fill them in,
# the paper says "[To be stated by the author.]". `accountability` is added
# to the Declaration of AI use.
# [paper.declarations]
# funding = "..."
# ethics = "..."
# competing_interests = "..."
# credit = "..."
# data = "Materials are deposited at https://doi.org/..."
# accountability = "..."

# Full names for the names you type in the app, as the Declaration should
# give them.
[paper.names]
yourname = "Your Name"

# Core studies: retained records whose charting meets every inclusion
# criterion. Each criterion names a charted map dimension and the values that
# meet it ("any" = anything reported) and, optionally, the screening metric
# whose score 0 at title and abstract also counts against it. The paper
# answers the review question from the core first; Table 2 shows every
# retained record against these criteria. `fails` labels the records that do
# not meet the criterion.
[[paper.core]]
id = "empirical"
short = "empirical"
label = "an original empirical study reporting results (an analysis was charted)"
dimension = "analysis"
values = "any"
metric = "empirical"
fail_types = ["dataset", "review", "editorial"]
fails = "not an original empirical study, or no results of its own"

[[paper.core]]
id = "setting"
short = "setting"
label = "work ends or never begins"
dimension = "setting"
values = ["job_loss", "furlough", "retirement", "youth_never_employed", "underemployment"]
metric = "setting"
fails = "outside the settings (incl. general older-adult samples)"

[[paper.core]]
id = "outcome"
short = "outcome"
label = "meaning in life, purpose, meaningful work or work identity as an outcome"
dimension = "construct"
values = ["meaning_in_life", "purpose_in_life", "meaningful_work", "work_identity"]
metric = "outcome"
fails = "meaning not an outcome (absent, or only predictor or correlate)"

[[paper.core]]
id = "design"
short = "design"
label = "longitudinal (two or more waves, or prospective)"
dimension = "design"
values = ["two_waves", "three_plus_waves", "prospective_cohort", "intensive_longitudinal", "qualitative_longitudinal", "intervention"]
metric = "design"
fails = "not longitudinal"

[[paper.core]]
id = "heterogeneity"
short = "heterogeneity"
label = "subgroups, trajectories or moderators reported"
dimension = "heterogeneity"
values = "any"
metric = "heterogeneity"
fail_types = ["dataset"]
fails = "no heterogeneity reported"

# Deviations from this protocol that you want reported in the Method, besides
